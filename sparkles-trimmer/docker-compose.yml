services:
  # umbrelOS injects the proxy container from this stub; auth is on by default
  app_proxy:
    environment:
      APP_HOST: sparkles-trimmer_app_1
      APP_PORT: 3030

  app:
    image: ghcr.io/onkr0d/titanic/trimmer:v2.1.2@sha256:db77048b5653060eeed0d943e35bd0057ebf2825baa074b9d24a771e5a25254b
    user: "0:0"
    restart: unless-stopped
    # no published ports on purpose: the app has no auth; Umbrel's app_proxy provides it
    environment:
      - RUST_LOG=info
      - MEDIA_PATH=/downloads
      - DATA_DIR=/data
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/home/Downloads:/downloads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
