services:
  # umbrelOS injects the proxy container from this stub; auth is on by default
  app_proxy:
    environment:
      APP_HOST: sparkles-titanic_app_1
      APP_PORT: 3031

  app:
    image: ghcr.io/onkr0d/titanic/titanic:v1.6.6@sha256:419ac2e453f3c19b2619791a2594adfbec262c99e14af24df3c80e925004aae4
    # root: the bind mounts below are host-owned and uid 1000 cannot write them (see 80b9a9a)
    user: "0:0"
    restart: unless-stopped
    # tailnet-only bind (see exports.sh); never publish 3031, the settings listener
    ports:
      - "${APP_TITANIC_BIND_IP:-127.0.0.1}:${APP_TITANIC_PORT:-3029}:3029"
    environment:
      - RUST_LOG=info
      - IS_DEV=false
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-titanic-uploader}
      - PLEX_MEDIA_PATH=${PLEX_MEDIA_PATH:-/downloads}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/home/Downloads:/downloads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3029/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
