services:
  app:
    image: ghcr.io/onkr0d/titanic/titanic:v1.5.0@sha256:74698f2d3a5210b2db47f9a6fcb9e494f3332f8a8adee298f5d13945adf8f42d
    user: "0:0"
    restart: unless-stopped
    # tailnet-only bind (see exports.sh): the VPS needs this port, the LAN must not reach it
    ports:
      - "${APP_TITANIC_BIND_IP:-0.0.0.0}:${APP_TITANIC_PORT:-3029}:3029"
    environment:
      - RUST_LOG=info
      - IS_DEV=false
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-titanic-uploader}
      - PLEX_MEDIA_PATH=${PLEX_MEDIA_PATH:-/downloads}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/home/Downloads:/downloads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3029/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
